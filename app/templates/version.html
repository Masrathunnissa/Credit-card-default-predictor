<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Model Version Info</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 0; }
        .navbar {
            background-color: #2c3e50;
            overflow: hidden;
            padding: 10px 20px;
            display: flex;
            justify-content: flex-start;
            gap: 5px; /* Controls spacing between items */
        }

        .navbar a {
            color: white;
            padding: 5px 10px;
            text-decoration: none;
            font-size: 16px;
            display: inline-block;
        }

        .navbar a:hover {
            background-color: #1abc9c;
            color: white;
        }
        .container { width: 90%; max-width: 600px; margin: 50px auto; background: #fff; padding: 30px 40px; border-radius: 10px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
        h1 { color: #34495e; text-align: center; }
        p { font-size: 16px; color: #2c3e50; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/">Single Prediction</a>
        <a href="/batch">Batch Prediction</a>
        <a href="/train">Train Model</a>
        <a href="/version">Version Info</a>
        <a href="/visual">Visualize Risk</a>
    </div>

    <div class="container">
        <h1>Model Version Info</h1>
        <p><strong>Version:</strong> 1.0.0</p>
        <p><strong>Model Type:</strong> Machine Learning Techniques.</p>
        <p><strong>Features:</strong> 23</p>
        <p><strong>Last Trained:</strong> {{ last_trained }}</p>
        <p><strong>Accuracy:</strong> {{ accuracy }}</p>
    </div>
</body>
</html>
